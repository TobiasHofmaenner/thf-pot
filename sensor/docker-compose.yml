# A sensor node. Fill in three values and run `docker compose up -d`.
services:
  sensor:
    image: ghcr.io/tobiashofmaenner/thf-pot-sensor:main
    container_name: thf-pot-sensor
    restart: unless-stopped
    environment:
      HUB_URL: "${HUB_URL:-https://pot.thfops.net}" # where events go
      SENSOR_TOKEN: "${SENSOR_TOKEN:?set SENSOR_TOKEN in .env}"
      DOMAINS: "${DOMAINS:?set DOMAINS in .env}" # comma-separated hostnames pointed at this node
      ACME_EMAIL: "${ACME_EMAIL:-}"              # optional, for certificate expiry notices
      # SELF_IPS: "203.0.113.5"                  # your own probe addresses, marked self=true
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - data:/data                               # events + certificate cache; the second copy of the evidence
      # To keep it in a host directory instead:  mkdir data && chown 65534:65534 data  then use ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  data:
