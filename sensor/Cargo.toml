[package]
name = "thf-pot-sensor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "thf-pot sensor node: a low-interaction web honeypot that records every request and ships it to the hub"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7.7", features = ["http1", "http2"] }
axum-server = { version = "0.7.1", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# ring everywhere: one crypto backend, builds on musl with nothing but a C compiler.
rustls-acme = { version = "0.11", default-features = false, features = ["axum", "ring", "tls12"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ulid = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
ipnet = "2.9"
memchr = "2.7"
rand = "0.8"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
