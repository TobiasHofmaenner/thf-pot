name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  sensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: sensor }
      - name: test
        run: cargo test --manifest-path sensor/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path sensor/Cargo.toml -- -D warnings

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag shape main-<unix-ts>-<sha7> sorts numerically for Flux ImagePolicy; "main" floats for compose users.
      - id: meta
        run: |
          echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"   # ghcr requires lowercase
      - uses: docker/build-push-action@v6
        with:
          context: sensor
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/thf-pot-sensor:main
            ghcr.io/${{ steps.meta.outputs.owner }}/thf-pot-sensor:main-${{ steps.meta.outputs.ts }}-${{ steps.meta.outputs.sha }}
