name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  sensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: sensor }
      - name: test
        run: cargo test --manifest-path sensor/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path sensor/Cargo.toml -- -D warnings

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag shape main-<unix-ts>-<sha7> sorts numerically for Flux ImagePolicy; "main" floats for compose users.
      - id: meta
        run: |
          echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"   # ghcr requires lowercase
      - uses: docker/build-push-action@v6
        with:
          context: sensor
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          cache-from: type=gha,scope=sensor
          cache-to: type=gha,mode=max,scope=sensor
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/thf-pot-sensor:main
            ghcr.io/${{ steps.meta.outputs.owner }}/thf-pot-sensor:main-${{ steps.meta.outputs.ts }}-${{ steps.meta.outputs.sha }}

  hub:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: thf_pot, POSTGRES_USER: thf_pot, POSTGRES_PASSWORD: thf_pot }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U thf_pot" --health-interval 2s --health-retries 15
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: thf_pot
      POSTGRES_USER: thf_pot
      POSTGRES_PASSWORD: thf_pot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: hub/requirements.txt }
      - name: check and test
        working-directory: hub
        run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput   # templates use the hashed-manifest storage
          python manage.py test -v 1

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: hub
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
          build-args: APP_VERSION=main-${{ steps.meta.outputs.ts }}-${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/thf-pot-hub:main
            ghcr.io/${{ steps.meta.outputs.owner }}/thf-pot-hub:main-${{ steps.meta.outputs.ts }}-${{ steps.meta.outputs.sha }}
